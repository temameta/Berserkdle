<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head}"/>
<body>
<main class="statistics-container">
  <h1>⚔️ Статистика Игрока ⚔️</h1>

  <div class="stats-grid">
    <div class="stat-card">
      <div class="stat-label">Всего сыграно игр</div>
      <div class="stat-value" th:text="${statistics.totalGamesPlayed}">0</div>
    </div>

    <div class="stat-card">
      <div class="stat-label">Побед</div>
      <div class="stat-value" th:text="${statistics.gamesWon}">0</div>
    </div>

    <div class="stat-card">
      <div class="stat-label">Всего попыток</div>
      <div class="stat-value" th:text="${statistics.totalAttempts}">0</div>
    </div>

    <div class="stat-card">
      <div class="stat-label">Среднее попыток до победы</div>
      <div class="stat-value" th:text="${#numbers.formatDecimal(averageAttemptsToWin, 1, 1)}">0</div>
    </div>

    <div class="stat-card">
      <div class="stat-label">Процент побед</div>
      <div class="stat-value" th:text="${#numbers.formatDecimal(winRate, 1, 1)}">0</div>
      <div class="stat-label">%</div>
    </div>

    <div class="stat-card">
      <div class="stat-label">Последняя игра</div>
      <div class="stat-value" th:text="${statistics.lastPlayed != null ?
                    #temporals.format(statistics.lastPlayed, 'dd.MM.yyyy HH:mm') : 'Никогда'}"></div>
    </div>
  </div>

  <div class="achievement" th:if="${statistics.gamesWon} >= 10">
    <h3>🏆 Достижения:</h3>
    <p th:if="${statistics.gamesWon} >= 10">🎖️ Ветеран Берсерка: 10+ побед!</p>
    <p th:if="${statistics.gamesWon} >= 50">👑 Легенда Мидленда: 50+ побед!</p>
    <p th:if="${averageAttemptsToWin} <= 3">⚡ Мастер дедукции: победа за 3 попытки или меньше!</p>
  </div>

  <a th:href="@{/game}" class="back-button">Вернуться к игре</a>
</main>
</body>
</html>
