<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{fragments/user-head}"/>
<body>
<main class="container">
  <hgroup>
    <h1>Профиль пользователя</h1>
    <p>Информация о вашей учетной записи</p>
  </hgroup>
  <article class="card">
    <div class="grid">
      <div th:object="${user}">
        <h2 th:text="*{username}"></h2>
        <p><strong>Логин:</strong> <span th:text="*{username}"></span></p>
        <p><strong>Email:</strong> <span th:text="*{email}"></span></p>
        <div>
          <strong>Роли:</strong>
          <div sec:authentication="principal.authorities" style="margin-top: 0.5rem;"></div>

          <br>

          <h1>Статистика Игрока</h1>

          <div class="stats-grid">
            <div class="stat-card">
              <div class="stat-label">Всего сыграно игр</div>
              <div class="stat-value" th:text="*{totalGamesPlayed}">0</div>
            </div>

            <div class="stat-card">
              <div class="stat-label">Побед</div>
              <div class="stat-value" th:text="*{gamesWon}">0</div>
            </div>

            <div class="stat-card">
              <div class="stat-label">Всего попыток</div>
              <div class="stat-value" th:text="*{totalAttempts}">0</div>
            </div>

            <div class="stat-card">
              <div class="stat-label">Процент побед</div>
              <div class="stat-value" th:text="${#numbers.formatDecimal(winRate, 1, 1)}">0</div>
              <div class="stat-label">%</div>
            </div>
          </div>
        </div>
      </div>
    </div>
    <a th:href="@{/}"><button class="border">Вернуться к игре</button></a>
  </article>

</main>
</body>
</html>
